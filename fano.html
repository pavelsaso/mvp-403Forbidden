<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart City AI Map</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
    <style>
        body{
            margin:0;
            font-family:Arial;
            background:#edf2f7;
        }
        header{
            background:#0f172a;
            color:white;
            text-align:center;
            padding:20px;
        }
        .dashboard{
            display:flex;
            justify-content:center;
            gap:20px;
            padding:20px;
            flex-wrap:wrap;
        }
        .card{
            background:white;
            width:250px;
            padding:20px;
            border-radius:15px;
            text-align:center;
            box-shadow:0 0 10px rgba(0,0,0,.1);
        }
        .buttons{
            text-align:center;
            margin:20px;
        }
        button{
            padding:15px;
            margin:10px;
            border:none;
            border-radius:10px;
            cursor:pointer;
            font-size:16px;
        }
        #map{
            height:500px;
            margin:20px;
            border-radius:20px;
        }
        .ia-panel{
            margin:20px;
            background:white;
            padding:20px;
            border-radius:20px;
            box-shadow:0 0 10px rgba(0,0,0,.1);
            font-size:22px;
        }
    </style>
</head>
<body>

<header>
    <h1>SMART CITY AI MAP</h1>
    <p>Sistema Inteligente de Riesgo Climático y Urbano</p>
</header>

<section class="dashboard">
    <div class="card">
        <h2>🌡 Temperatura</h2>
        <p id="temp">--</p>
    </div>
    <div class="card">
        <h2>🌧 Probabilidad de lluvia</h2>
        <p id="rain">--</p>
    </div>
    <div class="card">
        <h2>⚠ Riesgo IA</h2>
        <p id="risk">Analizando...</p>
    </div>
</section>

<div class="buttons">
    <button onclick="sendReport('Bache')">🕳 Reportar Bache</button>
    <button onclick="sendReport('Accidente')">⚠ Reportar Accidente</button>
    <button onclick="sendReport('Semaforo')">🚦 Reportar Semáforo</button>
</div>

<div id="map"></div>

<div class="ia-panel">
    <p id="prediction">Conectando inteligencia artificial urbana...</p>
</div>

<script>
    let reports = JSON.parse(localStorage.getItem('reports')) || [];

    const map = L.map('map').setView([19.0414, -98.2063], 13);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);

    async function loadWeather(){
        const res = await fetch('https://api.open-meteo.com/v1/forecast?latitude=19.04&longitude=-98.20&current=temperature_2m,precipitation_probability');
        const data = await res.json();

        document.getElementById('temp').innerText = data.current.temperature_2m + ' °C';
        document.getElementById('rain').innerText = data.current.precipitation_probability + ' %';

        analyzeRisk(data.current.precipitation_probability);
    }

    function loadReports(){
        reports.forEach(r=>{
            L.marker([r.lat,r.lng]).addTo(map).bindPopup(r.type);
            L.circle([r.lat,r.lng],{radius:250}).addTo(map);
        });
    }

    function sendReport(type){
        navigator.geolocation.getCurrentPosition((pos)=>{
            const report = {
                type:type,
                lat:pos.coords.latitude,
                lng:pos.coords.longitude
            };
            reports.push(report);
            localStorage.setItem('reports', JSON.stringify(reports));
            location.reload();
        });
    }

    function analyzeRisk(rain){
        let risk = 'BAJO';
        if(rain > 60 && reports.length >= 2){
            risk = 'ALTO';
        }else if(reports.length >= 1){
            risk = 'MODERADO';
        }

        document.getElementById('risk').innerText = risk;
        document.getElementById('prediction').innerText = 'IA detecta ' + reports.length + ' incidentes urbanos con riesgo ' + risk + ' de tráfico, inundación o accidentes.';
    }

    loadWeather();
    loadReports();
</script>

</body>
</html>
